name: Keep auth service warm

# A free-tier host sleeps its container after ~15 minutes of no traffic, and
# waking it takes 30-60 seconds. Login is the one request that cannot absorb
# that: the client already spends up to 25 seconds per attempt, the platform
# kills the function at 60, and the student sees a failure for a password that
# was correct. Pinging /health every 10 minutes means the container is awake
# when someone actually signs in.
#
# Set the repository variable PESU_AUTH_URL to your auth service's base URL
# (Settings -> Secrets and variables -> Actions -> Variables). Without it this
# workflow does nothing rather than failing loudly every ten minutes.
#
# Two things to know before relying on it:
#   - GitHub disables scheduled workflows on a repository with no activity for
#     60 days. A commit re-enables them.
#   - Cron here is best-effort and can be delayed under load, so treat this as
#     "usually warm", not a guarantee.
#   - On a 750-hour free monthly allowance, one always-awake service uses ~730.
#     A second one will not fit.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the auth service
        env:
          PESU_AUTH_URL: ${{ vars.PESU_AUTH_URL }}
        run: |
          if [ -z "$PESU_AUTH_URL" ]; then
            echo "PESU_AUTH_URL is not set; nothing to keep warm."
            exit 0
          fi

          url="${PESU_AUTH_URL%/}/health"
          # A cold container answers slowly rather than not at all, so wait for
          # it: a timeout here would leave the service asleep, which is the one
          # outcome this job exists to prevent.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$url" || echo "000")
          echo "GET $url -> $code"

          if [ "$code" != "200" ]; then
            echo "::warning::Auth service did not answer 200. Logins may be slow or failing."
          fi
