name: CI

# Every job below starts at the same time and reports as its own status check.
# The split is not cosmetic: a broken type annotation used to sit behind a
# Postgres container, a migration run, a seed and a full demo cohort before it
# said anything. Now it fails in about a minute, and the one job that genuinely
# needs a database is the only one that pays for one.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # postinstall runs `prisma generate`, so the client exists after this.
      # Every job needs it: the generated types are what tsc, vitest and the
      # build all read.
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No database service here on purpose. vitest.config.mts injects its own
      # unreachable DATABASE_URL, because lib/db.ts builds its client at module
      # load but connects lazily — a test that actually reached the database
      # would hang rather than pass, which is the intended signal.
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Also no database service. Every route under app/ is force-dynamic, so
      # nothing queries at build time; the client only needs a URL to exist at
      # module load. This mirrors what the unit tests already do.
      DATABASE_URL: postgresql://unused:unused@postgres.invalid:5432/unused
      # Signs session cookies. CI-only value; never reuse it anywhere real.
      SESSION_SECRET: ci_only_secret_not_used_outside_github_actions_0000
      PESU_AUTH_BASE_URL: http://localhost:5000
      PRIVACY_MIN_COHORT_SIZE: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  integration:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: placement
          POSTGRES_PASSWORD: placement_ci_only
          POSTGRES_DB: placement_tracker
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U placement -d placement_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://placement:placement_ci_only@localhost:5433/placement_tracker?schema=public
      # Signs session cookies. CI-only value; never reuse it anywhere real.
      SESSION_SECRET: ci_only_secret_not_used_outside_github_actions_0000
      PESU_AUTH_BASE_URL: http://localhost:5000
      PRIVACY_MIN_COHORT_SIZE: "5"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply migrations and seed configuration
        run: |
          npx prisma migrate deploy
          npm run seed

      # The demo harness is this project's integration suite. It drives the real
      # submission path and asserts on tier derivation, quota enforcement,
      # company-alias resolution, outlier flagging, corroboration and the
      # privacy gate. It exits non-zero if any check fails.
      #
      # It runs the sources directly through tsx, so it does not wait on the
      # build job.
      - name: Demo cohort (batch 9998)
        run: npm run demo:9998 -- --reset
